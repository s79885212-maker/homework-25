<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework #25 — Player</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-head">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M4 4v16M9 4v16M13.5 4l6 16" />
          </svg>
          <span>Категории</span>
        </div>

        <ul class="categories">
          <li class="category" data-category="jazz">
            <div class="cover cover-jazz">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M9 18V5l12-2v13" />
                <circle cx="6" cy="18" r="3" />
                <circle cx="18" cy="16" r="3" />
              </svg>
            </div>
            <div class="category-info">
              <span class="category-name">Jazz</span>
              <span class="category-count"
                >Плейлист · <span class="count">0</span> треков</span
              >
            </div>
            <svg class="category-sound" viewBox="0 0 24 24">
              <path d="M11 5 6 9H2v6h4l5 4V5z" />
              <path d="M15.5 8.5a5 5 0 0 1 0 7" />
            </svg>
          </li>
          <li class="category" data-category="classic">
            <div class="cover cover-classic">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M9 18V5l12-2v13" />
                <circle cx="6" cy="18" r="3" />
                <circle cx="18" cy="16" r="3" />
              </svg>
            </div>
            <div class="category-info">
              <span class="category-name">Classic</span>
              <span class="category-count"
                >Плейлист · <span class="count">0</span> треков</span
              >
            </div>
            <svg class="category-sound" viewBox="0 0 24 24">
              <path d="M11 5 6 9H2v6h4l5 4V5z" />
              <path d="M15.5 8.5a5 5 0 0 1 0 7" />
            </svg>
          </li>
          <li class="category" data-category="blues">
            <div class="cover cover-blues">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M9 18V5l12-2v13" />
                <circle cx="6" cy="18" r="3" />
                <circle cx="18" cy="16" r="3" />
              </svg>
            </div>
            <div class="category-info">
              <span class="category-name">Blues</span>
              <span class="category-count"
                >Плейлист · <span class="count">0</span> треков</span
              >
            </div>
            <svg class="category-sound" viewBox="0 0 24 24">
              <path d="M11 5 6 9H2v6h4l5 4V5z" />
              <path d="M15.5 8.5a5 5 0 0 1 0 7" />
            </svg>
          </li>
        </ul>
      </aside>

      <main class="main">
        <button class="theme-btn" id="themeBtn">
          <svg class="icon icon-moon" viewBox="0 0 24 24">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z" />
          </svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
            />
          </svg>
        </button>

        <section class="hero">
          <div class="hero-cover" id="heroCover">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M9 18V5l12-2v13" />
              <circle cx="6" cy="18" r="3" />
              <circle cx="18" cy="16" r="3" />
            </svg>
          </div>
          <div class="hero-info">
            <span class="hero-label">Плейлист</span>
            <h1 class="hero-title" id="heroTitle">Jazz</h1>
          </div>
        </section>

        <section class="playlist">
          <div class="playlist-actions">
            <button class="play-btn big" id="heroPlayBtn">
              <svg class="icon-play" viewBox="0 0 24 24">
                <path d="M7 4v16l13-8z" />
              </svg>
              <svg class="icon-pause" viewBox="0 0 24 24">
                <rect x="6" y="4" width="4" height="16" rx="1" />
                <rect x="14" y="4" width="4" height="16" rx="1" />
              </svg>
            </button>
            <button class="icon-btn shuffle-btn">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" />
              </svg>
            </button>
          </div>

          <div class="tracks-head">
            <span class="col-num">#</span>
            <span class="col-title">Название</span>
            <svg class="icon col-time" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 6v6l4 2" />
            </svg>
          </div>

          <ul class="tracks" id="trackList"></ul>
        </section>
      </main>

      <footer class="player">
        <div class="now">
          <div class="cover now-cover" id="nowCover">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M9 18V5l12-2v13" />
              <circle cx="6" cy="18" r="3" />
              <circle cx="18" cy="16" r="3" />
            </svg>
          </div>
          <div class="now-info">
            <span class="now-title" id="nowTitle">—</span>
            <span class="now-artist" id="nowArtist"></span>
          </div>
          <button class="icon-btn">
            <svg class="icon" viewBox="0 0 24 24">
              <path
                d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7z"
              />
            </svg>
          </button>
        </div>

        <div class="controls">
          <div class="buttons">
            <button class="icon-btn shuffle-btn">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" />
              </svg>
            </button>
            <button class="icon-btn" id="prevBtn">
              <svg class="icon icon-fill" viewBox="0 0 24 24">
                <path d="M19 20 9 12l10-8v16z" />
                <path d="M5 19V5" />
              </svg>
            </button>
            <button class="play-btn" id="playBtn">
              <svg class="icon-play" viewBox="0 0 24 24">
                <path d="M7 4v16l13-8z" />
              </svg>
              <svg class="icon-pause" viewBox="0 0 24 24">
                <rect x="6" y="4" width="4" height="16" rx="1" />
                <rect x="14" y="4" width="4" height="16" rx="1" />
              </svg>
            </button>
            <button class="icon-btn" id="nextBtn">
              <svg class="icon icon-fill" viewBox="0 0 24 24">
                <path d="m5 4 10 8-10 8V4z" />
                <path d="M19 5v14" />
              </svg>
            </button>
            <button class="icon-btn">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="m17 2 4 4-4 4" />
                <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
                <path d="m7 22-4-4 4-4" />
                <path d="M21 13v1a4 4 0 0 1-4 4H3" />
              </svg>
            </button>
          </div>
          <div class="progress-row">
            <span class="time" id="currentTime">0:00</span>
            <div class="progress" id="progress">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="time" id="duration">0:00</span>
          </div>
        </div>

        <div class="volume">
          <button class="icon-btn" id="muteBtn">
            <svg class="icon icon-volume" viewBox="0 0 24 24">
              <path d="M11 5 6 9H2v6h4l5 4V5z" />
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
            </svg>
            <svg class="icon icon-muted" viewBox="0 0 24 24">
              <path d="M11 5 6 9H2v6h4l5 4V5z" />
              <path d="m23 9-6 6M17 9l6 6" />
            </svg>
          </button>
          <input
            type="range"
            class="volume-range"
            id="volumeRange"
            min="0"
            max="100"
            value="70"
          />
        </div>
      </footer>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
